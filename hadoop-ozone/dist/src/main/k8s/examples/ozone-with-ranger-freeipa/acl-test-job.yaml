apiVersion: batch/v1
kind: Job
metadata:
  name: acl-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: acl-test-sa
      initContainers:
      - name: merge-conf
        image: apache/ozone-test:local
        command: ["sh","-c","set -e; cp -v /opt/ozone/etc/hadoop/* /merged/; cp -fv /cluster-conf/* /merged/"]
        volumeMounts:
        - { name: cluster-conf, mountPath: /cluster-conf, readOnly: true }
        - { name: merged-conf,  mountPath: /merged }
      - name: wait-prereqs
        image: rancher/kubectl:v1.30.7
        # rancher/kubectl entrypoint is `kubectl`; image has no shell. Use
        # a separate wait initContainer for prereqs.
        command:
        - kubectl
        - wait
        - --for=condition=complete
        - --timeout=15m
        - -n
        - ozone-test
        - job/acl-bootstrap
      - name: wait-policies
        image: rancher/kubectl:v1.30.7
        command:
        - kubectl
        - wait
        - --for=condition=complete
        - --timeout=15m
        - -n
        - ozone-test
        - job/ranger-policies-bootstrap
      - name: warmup
        image: busybox:1.36
        command: ["sh","-c","sleep 20"]
      containers:
      - name: acl-test
        image: apache/ozone-test:local
        volumeMounts:
        - { name: merged-conf,     mountPath: /etc/hadoop,            readOnly: true }
        - { name: testuser-keytabs,mountPath: /testuser-keytabs,      readOnly: true }
        - { name: krb5,            mountPath: /etc/krb5.conf, subPath: krb5.conf, readOnly: true }
        command:
        - bash
        - -c
        - |
          set -uo pipefail
          FAIL=0

          # Per-scenario kinit. Each block kinits as the named principal
          # and clears the cache between identities.
          kinit_as() {
            kdestroy -A 2>/dev/null || true
            kinit -kt "/testuser-keytabs/$1.keytab" "$1@EXAMPLE.COM"
            klist
          }

          run_ok() {
            local desc="$1"; shift
            if "$@" >/tmp/out 2>/tmp/err; then
              echo "OK   - $desc"
            else
              echo "FAIL - expected success, got error: $desc"
              cat /tmp/err
              FAIL=$((FAIL+1))
            fi
          }
          run_deny() {
            local desc="$1"; shift
            if "$@" >/tmp/out 2>/tmp/err; then
              echo "FAIL - expected DENY, command succeeded: $desc"
              FAIL=$((FAIL+1))
            elif grep -qiE 'permission_denied|access denied|not authorized|authorization failed' /tmp/err; then
              echo "DENY - $desc"
            else
              echo "FAIL - command failed but not with permission-denied: $desc"
              cat /tmp/err
              FAIL=$((FAIL+1))
            fi
          }

          echo seed > /tmp/seed

          echo "=== testuser scenarios ==="
          kinit_as testuser
          run_ok   "rw bucket1"                    ozone sh key put o3://om/vol1/bucket1/k1   /tmp/seed
          run_ok   "read bucket1"                  ozone sh key get o3://om/vol1/bucket1/k1   /tmp/got1
          run_ok   "read bucket2 via group1"       ozone sh key get o3://om/vol1/bucket2/seed /tmp/got2
          run_deny "write bucket2 (read-only ACL)" ozone sh key put o3://om/vol1/bucket2/k1   /tmp/seed
          run_deny "read bucket3 (no group2)"      ozone sh key get o3://om/vol1/bucket3/seed /tmp/got3
          run_deny "write bucket3 (no group2)"     ozone sh key put o3://om/vol1/bucket3/k1   /tmp/seed

          echo "=== testuser2 scenarios ==="
          kinit_as testuser2
          run_ok "create vol2"                    ozone sh volume create vol2
          run_ok "create vol2/bkt"                ozone sh bucket create vol2/bkt
          run_ok "write any bucket3"              ozone sh key put o3://om/vol1/bucket3/by-testuser2 /tmp/seed
          run_ok "delete vol2/bkt"                ozone sh bucket delete vol2/bkt
          run_ok "delete vol2"                    ozone sh volume delete vol2

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "RESULT: $FAIL assertion(s) failed"
            exit 1
          fi
          echo "RESULT: all ACL assertions passed"
      volumes:
      - { name: cluster-conf,     configMap: { name: config-default } }
      - { name: merged-conf,      emptyDir: {} }
      - { name: testuser-keytabs, secret:    { secretName: testuser-keytabs } }
      - { name: krb5,             configMap: { name: krb5 } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acl-test-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acl-test-role
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get","watch","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acl-test-rb
subjects:
- kind: ServiceAccount
  name: acl-test-sa
roleRef:
  kind: Role
  name: acl-test-role
  apiGroup: rbac.authorization.k8s.io
