apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: om
spec:
  serviceName: om
  replicas: 1
  selector:
    matchLabels: { app: ozone, component: om }
  template:
    metadata:
      labels: { app: ozone, component: om }
    spec:
      securityContext: { fsGroup: 1000 }
      initContainers:
      - name: merge-conf
        image: apache/ozone-test:local
        command:
        - sh
        - -c
        - |
          set -e
          cp -v /opt/ozone/etc/hadoop/* /merged/
          cp -fv /cluster-conf/* /merged/
        volumeMounts:
        - { name: cluster-conf, mountPath: /cluster-conf, readOnly: true }
        - { name: merged-conf,  mountPath: /merged }
      - name: wait-scm
        image: busybox:1.36
        command: ["sh","-c","until nc -z scm-0.scm 9876; do echo waiting scm; sleep 5; done"]
      - name: init-om
        image: apache/ozone-test:local
        command:
        - bash
        - -lc
        - |
          set -e
          if [ -e /data/metadata/om/current/VERSION ]; then
            echo "OM already initialized"; exit 0
          fi
          ozone om --init 2>&1
        volumeMounts:
        - { name: data,        mountPath: /data }
        - { name: merged-conf, mountPath: /etc/hadoop,                readOnly: true }
        - { name: ldap-creds,  mountPath: /etc/ldap-creds,            readOnly: true }
        - { name: keytabs,     mountPath: /etc/security/keytabs,      readOnly: true }
        - { name: krb5,        mountPath: /etc/krb5.conf, subPath: krb5.conf, readOnly: true }
      containers:
      - name: om
        image: apache/ozone-test:local
        command: ["bash","-lc","ozone om"]
        env:
        - { name: HADOOP_OPTS, value: "-Dlog4j.logger.org.apache.ranger.plugin.ipa=DEBUG" }
        ports:
        - { containerPort: 9862, name: client-rpc }
        # Step N — SIMPLE-sibling RPC port that S3G dials via HAUtils'
        # internal-caller port rewrite (ozone.om.service.rpc-address).
        - { containerPort: 9864, name: service-rpc }
        - { containerPort: 9874, name: ui }
        livenessProbe:
          tcpSocket: { port: 9862 }
          initialDelaySeconds: 90
          periodSeconds: 30
        volumeMounts:
        - { name: data,        mountPath: /data }
        - { name: merged-conf, mountPath: /etc/hadoop,                readOnly: true }
        - { name: ldap-creds,  mountPath: /etc/ldap-creds,            readOnly: true }
        - { name: keytabs,     mountPath: /etc/security/keytabs,      readOnly: true }
        - { name: krb5,        mountPath: /etc/krb5.conf, subPath: krb5.conf, readOnly: true }
      volumes:
      - { name: cluster-conf, configMap: { name: config-om } }
      - { name: merged-conf,  emptyDir: {} }
      - { name: ldap-creds,   secret:   { secretName: ldap-bind } }
      - { name: keytabs,      secret:   { secretName: keytabs } }
      - { name: krb5,         configMap: { name: krb5 } }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 4Gi } }
