# Same ACL matrix as acl-test but exercised through s3g instead of OM RPC.
#
# Flow:
#   1. kinit as <user>
#   2. `ozone s3 getsecret` against OM RPC — OM mints an aws-style
#      access/secret pair bound to the Kerberos identity
#   3. aws-cli signs SigV4 with that pair and hits s3g HTTP
#   4. s3g resolves the request through the same RangerOzoneAuthorizer
#      hop OM uses — so the same Ranger policies apply (modulo the
#      `ozone.s3g.volume.name=vol1` mapping that maps the S3 bucket
#      namespace onto vol1).
apiVersion: batch/v1
kind: Job
metadata:
  name: acl-test-s3
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: acl-test-sa
      initContainers:
      - name: merge-conf
        image: apache/ozone-test:local
        command: ["sh","-c","set -e; cp -v /opt/ozone/etc/hadoop/* /merged/; cp -fv /cluster-conf/* /merged/"]
        volumeMounts:
        - { name: cluster-conf, mountPath: /cluster-conf, readOnly: true }
        - { name: merged-conf,  mountPath: /merged }
      - name: wait-prereqs
        image: rancher/kubectl:v1.30.7
        command:
        - kubectl
        - wait
        - --for=condition=complete
        - --timeout=15m
        - -n
        - ozone-test
        - job/acl-bootstrap
      - name: wait-s3g
        image: busybox:1.36
        command: ["sh","-c","until nc -z s3g 9878; do echo waiting s3g; sleep 5; done"]
      - name: warmup
        image: busybox:1.36
        command: ["sh","-c","sleep 20"]
      containers:
      - name: acl-test-s3
        image: apache/ozone-test:local
        volumeMounts:
        - { name: merged-conf,     mountPath: /etc/hadoop,            readOnly: true }
        - { name: testuser-keytabs,mountPath: /testuser-keytabs,      readOnly: true }
        - { name: krb5,            mountPath: /etc/krb5.conf, subPath: krb5.conf, readOnly: true }
        env:
        - { name: AWS_REGION,                value: us-east-1 }
        - { name: AWS_DEFAULT_REGION,        value: us-east-1 }
        - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
        command:
        - bash
        - -c
        - |
          set -uo pipefail
          FAIL=0
          S3_ENDPOINT=http://s3g:9878

          if ! command -v aws >/dev/null ; then
            echo "aws CLI not in image, installing"
            pip install --quiet awscli || { echo "no pip either"; exit 2; }
          fi

          kinit_and_set_aws_creds() {
            local user="$1"
            kdestroy -A 2>/dev/null || true
            kinit -kt "/testuser-keytabs/${user}.keytab" "${user}@EXAMPLE.COM"
            # ozone s3 getsecret errors if a secret already exists for the
            # principal. Revoke first so we always get a fresh, parseable
            # output — the Kerberos identity stays the same so this is safe.
            ozone s3 revokesecret -y >/dev/null 2>&1 || true
            local out ak sk
            out=$(ozone s3 getsecret 2>&1)
            ak=$(echo "$out" | awk -F= '/^awsAccessKey/ {print $2}')
            sk=$(echo "$out" | awk -F= '/^awsSecret/    {print $2}')
            if [ -z "$ak" ] || [ -z "$sk" ]; then
              echo "FAIL: could not parse S3 secret for $user"
              echo "$out"
              exit 2
            fi
            export AWS_ACCESS_KEY_ID="$ak"
            export AWS_SECRET_ACCESS_KEY="$sk"
            echo "got S3 secret for $user (ak prefix: ${ak:0:12}…)"
          }

          run_ok() {
            local desc="$1"; shift
            if "$@" >/tmp/out 2>/tmp/err; then
              echo "OK   - $desc"
            else
              echo "FAIL - expected success, got error: $desc"
              cat /tmp/err
              FAIL=$((FAIL+1))
            fi
          }
          run_deny() {
            local desc="$1"; shift
            if "$@" >/tmp/out 2>/tmp/err; then
              echo "FAIL - expected DENY, command succeeded: $desc"
              FAIL=$((FAIL+1))
            elif grep -qiE 'AccessDenied|Forbidden|403|permission_denied|not authorized' /tmp/err; then
              echo "DENY - $desc"
            else
              echo "FAIL - command failed but not with access-denied: $desc"
              cat /tmp/err
              FAIL=$((FAIL+1))
            fi
          }

          AWS="aws --endpoint-url $S3_ENDPOINT"
          echo seed > /tmp/seed

          echo "=== testuser via s3g ==="
          kinit_and_set_aws_creds testuser
          run_ok   "rw bucket1"                    $AWS s3 cp /tmp/seed s3://bucket1/k1
          run_ok   "read bucket1"                  $AWS s3 cp s3://bucket1/k1   /tmp/got1
          run_ok   "read bucket2 via group1"       $AWS s3 cp s3://bucket2/seed /tmp/got2
          run_deny "write bucket2 (read-only ACL)" $AWS s3 cp /tmp/seed s3://bucket2/k1
          run_deny "read bucket3 (no group2)"      $AWS s3 cp s3://bucket3/seed /tmp/got3
          run_deny "write bucket3 (no group2)"     $AWS s3 cp /tmp/seed s3://bucket3/k1

          echo "=== testuser2 via s3g (admin) ==="
          kinit_and_set_aws_creds testuser2
          run_ok "list bucket1"                    $AWS s3 ls s3://bucket1/
          run_ok "write any bucket3"               $AWS s3 cp /tmp/seed s3://bucket3/by-testuser2
          run_ok "read seeded bucket3"             $AWS s3 cp s3://bucket3/seed /tmp/got4

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "RESULT: $FAIL S3 assertion(s) failed"
            exit 1
          fi
          echo "RESULT: all S3 ACL assertions passed"
      volumes:
      - { name: cluster-conf,     configMap: { name: config-default } }
      - { name: merged-conf,      emptyDir: {} }
      - { name: testuser-keytabs, secret:    { secretName: testuser-keytabs } }
      - { name: krb5,             configMap: { name: krb5 } }
