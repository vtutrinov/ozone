# Recon — cluster monitoring / management UI. Single replica; not part
# of consensus. Communicates with OM (snapshot pull, internal=true →
# OM SIMPLE sibling port 9864 per Step C-2) and SCM (container/pipeline
# state pull). DataNodes additionally heartbeat to Recon on 9891
# (ozone.recon.datanode.address).
#
# In split-Kerberos mode (interservice=false) Recon's daemon login is
# skipped (Step B/J), so it carries no Kerberos identity at runtime and
# does NOT need a recon.keytab. The shared `keytabs` Secret is still
# mounted to keep the volume layout consistent with the other daemons.
apiVersion: v1
kind: Service
metadata:
  name: recon
  namespace: ozone-extkdc-cluster
spec:
  clusterIP: None
  ports:
  - port: 9888
    name: http
  - port: 9891
    name: dn-proto
  selector:
    app: ozone-extkdc
    component: recon
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recon
  namespace: ozone-extkdc-cluster
spec:
  selector:
    matchLabels:
      app: ozone-extkdc
      component: recon
  serviceName: recon
  replicas: 1
  template:
    metadata:
      labels:
        app: ozone-extkdc
        component: recon
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: recon
        image: ozone-split-kerberos:dev
        imagePullPolicy: IfNotPresent
        args: [ozone, recon]
        env:
        - name: WAITFOR
          value: scm-0.scm.ozone-extkdc-cluster.svc.cluster.local:9876
        ports:
        - containerPort: 9888
          name: http
        - containerPort: 9891
          name: dn-proto
        envFrom:
        - configMapRef:
            name: config
        volumeMounts:
        - name: data
          mountPath: /data
        - name: keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
        - name: krb5
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
      volumes:
      - name: keytabs
        secret:
          secretName: keytabs
      - name: krb5
        configMap:
          name: krb5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
