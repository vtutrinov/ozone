# S3G has the only HTTP surface external clients reach; AWS Sig V4 carries
# the auth (HMAC validated by OM), so no SPNEGO is required and the KDC
# only needs the s3g-public identity for the keytab login.
apiVersion: v1
kind: Service
metadata:
  name: s3g
  namespace: ozone-extkdc-cluster
spec:
  clusterIP: None
  ports:
  - port: 9878
    name: http
  selector:
    app: ozone-extkdc
    component: s3g
---
apiVersion: v1
kind: Service
metadata:
  name: s3g-public
  namespace: ozone-extkdc-cluster
spec:
  ports:
  - port: 9878
    name: http
  selector:
    app: ozone-extkdc
    component: s3g
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3g
  namespace: ozone-extkdc-cluster
spec:
  selector:
    matchLabels:
      app: ozone-extkdc
      component: s3g
  serviceName: s3g
  replicas: 1
  template:
    metadata:
      labels:
        app: ozone-extkdc
        component: s3g
    spec:
      hostname: s3g-0
      subdomain: s3g
      securityContext:
        fsGroup: 1000
      containers:
      - name: s3g
        image: ozone-split-kerberos:dev
        imagePullPolicy: IfNotPresent
        args: [ozone, s3g]
        env:
        - name: WAITFOR
          value: om-0.om.ozone-extkdc-cluster.svc.cluster.local:9862
        ports:
        - containerPort: 9878
          name: http
        envFrom:
        - configMapRef:
            name: config
        volumeMounts:
        - name: keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
        - name: krb5
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
      volumes:
      - name: keytabs
        secret:
          secretName: keytabs
      - name: krb5
        configMap:
          name: krb5
