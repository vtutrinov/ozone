# KDC lives in the edge namespace and is reachable cluster-wide via
# kdc.ozone-extkdc-edge.svc.cluster.local. The deploy script seeds it with
# the *stable-name* principals only — no per-pod-FQDN entries.

apiVersion: v1
kind: Service
metadata:
  name: kdc
  namespace: ozone-extkdc-edge
spec:
  ports:
  - port: 88
    name: kerberos
    protocol: TCP
  - port: 88
    name: kerberos-udp
    protocol: UDP
  selector:
    app: ozone-extkdc
    component: kdc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kdc
  namespace: ozone-extkdc-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ozone-extkdc
      component: kdc
  template:
    metadata:
      labels:
        app: ozone-extkdc
        component: kdc
    spec:
      containers:
      - name: kdc
        image: apache/ozone-testkrb5:20230318-1
        command: ["krb5kdc", "-n"]
        ports:
        - containerPort: 88
          protocol: TCP
        - containerPort: 88
          protocol: UDP
