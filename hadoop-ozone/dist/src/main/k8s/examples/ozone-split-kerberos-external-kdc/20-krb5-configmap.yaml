# Shared krb5.conf: both the edge namespace (KDC + client) and the cluster
# namespace (OM/S3G keytab login) need this. Pointing kdc= at the edge
# namespace's KDC Service via in-cluster DNS — the only piece of "internal"
# topology that leaks across the namespace boundary, and it's deliberate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: krb5
  namespace: ozone-extkdc-edge
data:
  krb5.conf: |
    [logging]
      default = FILE:/var/log/krb5libs.log
      kdc     = FILE:/var/log/krb5kdc.log
    [libdefaults]
      dns_canonicalize_hostname = false
      dns_lookup_realm  = false
      ticket_lifetime   = 24h
      renew_lifetime    = 7d
      forwardable       = true
      rdns              = false
      default_realm     = EXAMPLE.COM
      udp_preference_limit = 1
    [realms]
      EXAMPLE.COM = {
        kdc          = kdc.ozone-extkdc-edge.svc.cluster.local
        admin_server = kdc.ozone-extkdc-edge.svc.cluster.local
      }
    [domain_realm]
      .svc.cluster.local = EXAMPLE.COM
      svc.cluster.local  = EXAMPLE.COM
---
apiVersion: v1
