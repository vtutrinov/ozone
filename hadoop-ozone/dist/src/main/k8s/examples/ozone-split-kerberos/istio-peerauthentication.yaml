# Apply this manifest only when an Istio control plane is installed in the
# cluster — it is intentionally NOT in the main kustomization.yaml.
#
# STRICT mTLS on the namespace provides the inter-service authenticity
# guarantee that the split-Kerberos mode trades off: services no longer
# Kerberos-authenticate each other, so the mesh must.

apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: ozone-strict-mtls
spec:
  mtls:
    mode: STRICT
---
# Allow only the test client and Ozone components to call the OM service-RPC
# port (9864, SIMPLE auth). External traffic must continue to use the
# Kerberos-protected client port (9862).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: om-service-rpc-allowlist
spec:
  selector:
    matchLabels:
      app: ozone
      component: om
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/default
    to:
    - operation:
        ports: ["9864"]
