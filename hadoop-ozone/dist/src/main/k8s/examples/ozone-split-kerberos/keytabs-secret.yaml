# Holds the keytabs mounted into every Ozone daemon pod plus the test
# client. The Secret created here is a *placeholder* with empty values —
# operators must populate it from the KDC pod after applying the example:
#
#   POD=$(kubectl get pod -l component=kdc -o name | head -1)
#   for principal in \
#       om/om-0.om \
#       scm/scm-0.scm \
#       s3g/s3g-0.s3g \
#       dn/dn-0.datanode dn/dn-1.datanode dn/dn-2.datanode \
#       HTTP/om-0.om HTTP/scm-0.scm HTTP/s3g-0.s3g \
#       testuser ; do
#     kubectl exec $POD -- kadmin.local -q "addprinc -randkey $principal@EXAMPLE.COM"
#   done
#   for keytab in om scm s3g dn HTTP testuser ; do
#     kubectl exec $POD -- kadmin.local -q "ktadd -k /tmp/$keytab.keytab $keytab"
#     kubectl cp $POD:/tmp/$keytab.keytab /tmp/$keytab.keytab
#   done
#   kubectl create secret generic keytabs \
#     --from-file=om.keytab=/tmp/om.keytab \
#     --from-file=scm.keytab=/tmp/scm.keytab \
#     --from-file=s3g.keytab=/tmp/s3g.keytab \
#     --from-file=dn.keytab=/tmp/dn.keytab \
#     --from-file=HTTP.keytab=/tmp/HTTP.keytab \
#     --from-file=testuser.keytab=/tmp/testuser.keytab \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Pods that mount this Secret will fail their first start until it is
# populated; restart them after the Secret is in place.

apiVersion: v1
kind: Secret
metadata:
  name: keytabs
type: Opaque
data:
  # Each value is base64 of the keytab file content. Empty here on purpose.
  om.keytab: ""
  scm.keytab: ""
  s3g.keytab: ""
  dn.keytab: ""
  HTTP.keytab: ""
  testuser.keytab: ""
