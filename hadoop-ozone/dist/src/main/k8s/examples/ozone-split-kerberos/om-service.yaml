# Headless service exposes both the Kerberos-required client port (9862)
# and the SIMPLE-auth service-RPC port (9864). The split is enforced inside
# OM by the two distinct RPC.Server instances bound to the same JVM.
apiVersion: v1
kind: Service
metadata:
  name: om
spec:
  clusterIP: None
  ports:
  - port: 9862
    name: client-rpc
  - port: 9864
    name: service-rpc
  - port: 9874
    name: ui
  selector:
    app: ozone
    component: om
