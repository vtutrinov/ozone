# Spark configuration for the ozone-oauth-spark suite.
#
# Both the driver and executor JVMs load security-auth-agent so
# every Spark process talks to Ozone as user "spark" via OAuth.
# The agent's auth-token-renewal=both keeps long-running jobs
# alive across the 90-second access-token TTL (matching the rest
# of the OAuth-only suites).

spark.master                       spark://spark-master:7077
spark.eventLog.enabled             false

# Default FS so anything not fully qualified lands on Ozone.
spark.hadoop.fs.defaultFS          ofs://om/volume1/bucket1

# Make ofs:// resolvable. /opt/ozone is the dist bind-mount.
spark.driver.extraClassPath        /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-2.2.0-SNAPSHOT.jar
spark.executor.extraClassPath      /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-2.2.0-SNAPSHOT.jar

# Load the OAuth agent into driver + executor JVMs. The agent's
# UGI replacement runs at premain so Spark's later FileSystem.get
# call for ofs:// already has the OAuth-authenticated UGI.
spark.driver.extraJavaOptions      -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-2.2.0-SNAPSHOT.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both -Djava.security.krb5.realm=EXAMPLE.COM -Djava.security.krb5.kdc=kdc.example.com
spark.executor.extraJavaOptions    -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-2.2.0-SNAPSHOT.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both -Djava.security.krb5.realm=EXAMPLE.COM -Djava.security.krb5.kdc=kdc.example.com

# Propagate the OAuth env into executor child JVMs. spark-submit
# already passes these from the master/worker shell env; this
# block is a defence-in-depth so executors see them even if the
# worker launches them in a stripped environment.
spark.executorEnv.AUTH_SERVER_URL  http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
spark.executorEnv.AUTH_CLIENT_ID   ozone-client
spark.executorEnv.AUTH_LOGIN       spark
spark.executorEnv.AUTH_PASSWORD    spark

# Sensible defaults for the in-container worker.
spark.executor.cores               1
spark.executor.memory              512m
spark.cores.max                    2
