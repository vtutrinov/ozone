# ============================================================
# Secure Ozone + Hive Metastore (HMS) backed by Postgres.
#
# Same OAuth-via-Keycloak setup as `ozone-oauth/`, with an
# additional Postgres + HMS pair. HMS uses the security-auth-agent
# in its JVM so its UGI.loginUserFromKeytab call is intercepted
# (no KDC, no keytab files). HMS's warehouse points at
# ofs://om/warehouse so its DDL operations write through Ozone.
# ============================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    hostname: keycloak
    dns_search: .
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/ozone-realm.json
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  scm:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: scm
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "${OZONE_SAFEMODE_MIN_DATANODES:-1}"
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: scm
      AUTH_PASSWORD: scm
    command: ["/opt/hadoop/bin/ozone","scm"]
    depends_on:
      keycloak:
        condition: service_healthy
  om:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: om
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: om
      AUTH_PASSWORD: om
    command: ["/opt/hadoop/bin/ozone","om"]
    depends_on:
      keycloak:
        condition: service_healthy
  datanode:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: dn
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: dn
      AUTH_PASSWORD: dn
    command: ["/opt/hadoop/bin/ozone","datanode"]
    depends_on:
      keycloak:
        condition: service_healthy
  s3g:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: s3g
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    ports:
      - 9878:9878
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: s3g
      AUTH_PASSWORD: s3g
    command: ["/opt/hadoop/bin/ozone","s3g"]
    depends_on:
      keycloak:
        condition: service_healthy
  recon:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: recon
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    ports:
      - 9888:9888
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: recon
      AUTH_PASSWORD: recon
    command: ["/opt/hadoop/bin/ozone","recon"]
    depends_on:
      keycloak:
        condition: service_healthy

  # ------------------------------------------------------------
  # Hive Metastore stack
  # ------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    dns_search: .
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  hms:
    image: apache/hive:${HIVE_VERSION}
    hostname: hms
    dns_search: .
    ports:
      - 9083:9083
    env_file:
      - docker-config
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
        -Djava.security.krb5.realm=EXAMPLE.COM
        -Djava.security.krb5.kdc=kdc.example.com
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
      # security-auth-agent OAuth credentials — HMS authenticates
      # to Ozone (OM/SCM) as user `hms` via the agent's env
      # AuthDataProvider; no KDC, no keytab needed.
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: hms
      AUTH_PASSWORD: hms
      # Make the ozone-filesystem-hadoop3 shaded jar visible to
      # Hive so HMS can address ofs:// warehouse paths.
      HIVE_AUX_JARS_PATH: /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-${HDDS_VERSION}.jar
      # Expose Ozone's hadoop layout to HMS for ofs:// resolution
      # and let the agent jar live alongside.
      HADOOP_CLASSPATH: /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-${HDDS_VERSION}.jar
    volumes:
      - ../..:/opt/ozone
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./core-site.xml:/opt/hive/conf/core-site.xml
      - ./ozone-site.xml:/opt/hive/conf/ozone-site.xml
      # Postgres JDBC driver — fetched by test.sh into ./jars/.
      # Mounted into Hive's lib so schematool can load Driver early
      # in the entrypoint, before any HIVE_AUX_JARS_PATH scanning.
      - ./jars/postgresql.jar:/opt/hive/lib/postgresql.jar
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      om:
        condition: service_started

  hiveserver2:
    image: apache/hive:${HIVE_VERSION}
    hostname: hiveserver2
    dns_search: .
    ports:
      - 10000:10000
      - 10002:10002
    env_file:
      - docker-config
    environment:
      SERVICE_NAME: hiveserver2
      # Don't try to (re)initialise schema — hms already did.
      IS_RESUME: "true"
      # Talk to the standalone metastore instead of running an
      # embedded one. The default for hiveserver2 is embedded; the
      # uri here is what makes it remote-mode.
      SERVICE_OPTS: >-
        -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
        -Djava.security.krb5.realm=EXAMPLE.COM
        -Djava.security.krb5.kdc=kdc.example.com
        -Dhive.metastore.uris=thrift://hms:9083
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: hms
      AUTH_PASSWORD: hms
      HIVE_AUX_JARS_PATH: /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-${HDDS_VERSION}.jar
      HADOOP_CLASSPATH: /opt/ozone/share/ozone/lib/ozone-filesystem-hadoop3-${HDDS_VERSION}.jar
    volumes:
      - ../..:/opt/ozone
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./core-site.xml:/opt/hive/conf/core-site.xml
      - ./ozone-site.xml:/opt/hive/conf/ozone-site.xml
      - ./jars/postgresql.jar:/opt/hive/lib/postgresql.jar
    depends_on:
      hms:
        condition: service_started
      keycloak:
        condition: service_healthy
