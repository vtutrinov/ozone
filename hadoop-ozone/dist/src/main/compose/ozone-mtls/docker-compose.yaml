version: "3.8"
services:
  kdc:
    image: ${OZONE_TESTKRB5_IMAGE}
    hostname: kdc
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
    command: ["krb5kdc", "-n"]
    networks:
      ozone_net:
        ipv4_address: 172.25.0.100
  ocsp-responder:
    image: alpine/openssl:latest
    hostname: ocsp
    ports:
      - 2560:2560
    volumes:
      - ./certs:/etc/certs:ro
    command:
      - ocsp
      - -port
      - "2560"
      - -index
      - /etc/certs/index.txt
      - -CA
      - /etc/certs/ca.crt
      - -rkey
      - /etc/certs/ca.key
      - -rsigner
      - /etc/certs/ca.crt
    networks:
      ozone_net:
        ipv4_address: 172.25.0.101
  datanode:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    command: ["/opt/hadoop/bin/ozone", "datanode"]
    extra_hosts:
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
      - recon:172.25.0.115
    env_file:
      - docker-config
    environment:
      WAITFOR: scm3.org:9894
      OZONE_OPTS:
    networks:
      - ozone_net
  om1:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: om1
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9880:9874
      - 9881:9875
    environment:
      WAITFOR: scm3.org:9894
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS:
    env_file:
      - ./docker-config
    command: ["/opt/hadoop/bin/ozone", "om"]
    extra_hosts:
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.111
  om2:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: om2
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9882:9874
      - 9883:9875
    environment:
      WAITFOR: scm3.org:9894
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS:
    env_file:
      - ./docker-config
    command: ["/opt/hadoop/bin/ozone", "om"]
    extra_hosts:
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.112
  om3:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: om3
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9884:9874
      - 9885:9875
    environment:
      WAITFOR: scm3.org:9894
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS:
    env_file:
      - ./docker-config
    command: ["/opt/hadoop/bin/ozone", "om"]
    extra_hosts:
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.113
  s3g:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: s3g
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9878:9878
      - 9879:9879
    env_file:
      - ./docker-config
    command: ["/opt/hadoop/bin/ozone", "s3g"]
    environment:
      OZONE-SITE.XML_ozone.https.client.need-auth: "false"
      OZONE-SITE.XML_ozone.https.client.want-auth: "true"
      OZONE-SITE.XML_ozone.https.cert.validation.included.paths: "/conf,/prom,/jmx,/stacks,/logstream"
      OZONE_OPTS:
    networks:
      ozone_net:
        ipv4_address: 172.25.0.114
  recon:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: recon
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9888:9888
      - 9889:9889
    env_file:
      - ./docker-config
    environment:
      OZONE_OPTS:
    command: ["/opt/hadoop/bin/ozone", "recon"]
    extra_hosts:
      - om1:172.25.0.111
      - om2:172.25.0.112
      - om3:172.25.0.113
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.115
  scm1.org:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: scm1.org
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9990:9876
      - 9991:9877
    env_file:
      - docker-config
    environment:
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "${OZONE_SAFEMODE_MIN_DATANODES:-3}"
      OZONE_OPTS:
    command: ["/opt/hadoop/bin/ozone", "scm"]
    extra_hosts:
      - om1:172.25.0.111
      - om2:172.25.0.112
      - om3:172.25.0.113
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.116
  scm2.org:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: scm2.org
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9994:9876
      - 9995:9877
    env_file:
      - docker-config
    environment:
      WAITFOR: scm1.org:9894
      ENSURE_SCM_BOOTSTRAPPED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "${OZONE_SAFEMODE_MIN_DATANODES:-3}"
      OZONE_OPTS:
    command: ["/opt/hadoop/bin/ozone", "scm"]
    extra_hosts:
      - om1:172.25.0.111
      - om2:172.25.0.112
      - om3:172.25.0.113
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.117
  scm3.org:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: scm3.org
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ./certs:/etc/certs:ro
    ports:
      - 9998:9876
      - 9999:9877
    env_file:
      - docker-config
    environment:
      WAITFOR: scm2.org:9894
      ENSURE_SCM_BOOTSTRAPPED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "${OZONE_SAFEMODE_MIN_DATANODES:-3}"
      OZONE_OPTS:
    command: ["/opt/hadoop/bin/ozone", "scm"]
    extra_hosts:
      - om1:172.25.0.111
      - om2:172.25.0.112
      - om3:172.25.0.113
      - scm1.org:172.25.0.116
      - scm2.org:172.25.0.117
      - scm3.org:172.25.0.118
    networks:
      ozone_net:
        ipv4_address: 172.25.0.118
networks:
  ozone_net:
    ipam:
      driver: default
      config:
        - subnet: "172.25.0.0/24"
