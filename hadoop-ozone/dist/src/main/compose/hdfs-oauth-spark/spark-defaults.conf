spark.master                       spark://spark-master:7077
spark.eventLog.enabled             false
spark.hadoop.fs.defaultFS          hdfs://namenode:9000

# The agent rides in every JVM Spark forks: driver (spark-submit /
# spark-sql / spark-shell) and executors launched by the worker.
# No extra filesystem jar needed — Spark 4 bundles the Hadoop 3.4
# hdfs client natively.
spark.driver.extraJavaOptions      -javaagent:/opt/security-auth-agent.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both -Djava.security.krb5.realm=EXAMPLE.COM -Djava.security.krb5.kdc=kdc.example.com
spark.executor.extraJavaOptions    -javaagent:/opt/security-auth-agent.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both -Djava.security.krb5.realm=EXAMPLE.COM -Djava.security.krb5.kdc=kdc.example.com
spark.executorEnv.AUTH_SERVER_URL  http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
spark.executorEnv.AUTH_CLIENT_ID   ozone-client
spark.executorEnv.AUTH_LOGIN       spark
spark.executorEnv.AUTH_PASSWORD    spark
spark.executor.cores               1
spark.executor.memory              512m
spark.cores.max                    2
