# Enables the Ranger ozone plugin (RangerOzoneAuthorizer) on all three OMs.
# Requires the untarred ranger-ozone-plugin in $RANGER_OZONE_PLUGIN_DIR.
#
# The policy cache TTL (fail-closed) is set low for testing:
# expiry 60s, poll interval 5s.

x-om-ranger-config:
  &om-ranger-config
    environment:
      OZONE_MANAGER_CLASSPATH: "/opt/ranger/ozone-plugin/lib/libext/*:/opt/ozone/conf"
      OZONE-SITE.XML_ozone.acl.authorizer.class: "org.apache.ranger.authorization.ozone.authorizer.RangerOzoneAuthorizer"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.forceNonKerberos: "true"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.url: "http://ranger:6080"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.client.username: "admin"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.client.password: "rangerR0cks!"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.service.name: "dev_ozone"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.pollIntervalMs: "5000"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.cache.expiryMs: "60000"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.cache.dir: "/tmp/policycache"
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ${RANGER_OZONE_PLUGIN_DIR}:/opt/ranger/ozone-plugin
    tmpfs:
      - /opt/ozone/conf
    command: ["bash", "-c", "sudo --preserve-env /opt/ranger/ozone-plugin/enable-ozone-plugin.sh && /opt/hadoop/bin/ozone om"]

services:
  om1:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  om2:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  om3:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  ranger:
    networks:
      ozone_net:
        ipv4_address: 172.25.0.200
  ranger-db:
    networks:
      ozone_net:
        ipv4_address: 172.25.0.201
