# Alert rules for S3 Gateway XID metrics (S3GatewayXidMetrics).
groups:
  - name: s3-gateway-xid
    rules:
      # Emitted when unique XID count exceeds XID_MONITORING_THRESHOLD (5000).
      - alert: S3GatewayHighActiveXidCount
        expr: s3_gateway_xid_metrics_active_xid_count > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "S3 Gateway tracks {{ $value }} unique XIDs"
          description: "Number of tracked XIDs exceeded the memory monitoring threshold. Consider migrating per-XID latency samples to an approximate sketch (e.g. HdrHistogram) to reduce memory usage."

      # Ratio is emitted only above the threshold; value > 1 means the count is above the cap.
      - alert: S3GatewayHighXidMemoryRatio
        expr: s3_gateway_xid_metrics_xid_memory_ratio > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "S3 Gateway XID memory ratio is high ({{ $value }})"
          description: "Per-XID latency samples are consuming more memory than expected. Investigate candidate XIDs or migrate to an approximate sketch."

      # Sustained error rate on S3 requests (error_count / count_requests).
      - alert: S3GatewayHighErrorRate
        expr: sum(rate(s3_gateway_xid_metrics_error_count[5m])) / clamp_min(sum(rate(s3_gateway_xid_metrics_count_requests[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "S3 Gateway error rate above 5% ({{ $value | humanizePercentage }}) in the last 5 minutes"
          description: "The share of failed S3 requests exceeded the 5% threshold. Check S3 Gateway logs for recurring error codes."