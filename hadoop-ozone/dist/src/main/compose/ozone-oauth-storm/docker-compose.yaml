# ============================================================
# Secure Ozone (OAuth-only) + Apache Storm cluster.
#
# Same OAuth-via-Keycloak base as ozone-oauth/. Adds a Storm
# nimbus + supervisor pair (plus a ZooKeeper for coordination)
# so topologies can read/write ofs:// keys via the
# security-auth-agent's OAuth-authenticated UGI.
# ============================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    hostname: keycloak
    dns_search: .
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/ozone-realm.json
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  scm:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: scm
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "${OZONE_SAFEMODE_MIN_DATANODES:-1}"
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: scm
      AUTH_PASSWORD: scm
    command: ["/opt/hadoop/bin/ozone","scm"]
    depends_on:
      keycloak:
        condition: service_healthy

  om:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: om
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      WAITFOR: scm:9876
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: om
      AUTH_PASSWORD: om
    command: ["/opt/hadoop/bin/ozone","om"]
    depends_on:
      keycloak:
        condition: service_healthy

  datanode:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: dn
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: dn
      AUTH_PASSWORD: dn
    command: ["/opt/hadoop/bin/ozone","datanode"]
    depends_on:
      keycloak:
        condition: service_healthy

  s3g:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: s3g
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    ports:
      - 9878:9878
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: s3g
      AUTH_PASSWORD: s3g
    command: ["/opt/hadoop/bin/ozone","s3g"]
    depends_on:
      keycloak:
        condition: service_healthy

  recon:
    image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
    hostname: recon
    dns_search: .
    volumes:
      - ../..:/opt/hadoop
    ports:
      - 9888:9888
    env_file:
      - docker-config
    environment:
      OZONE_OPTS: -javaagent:/opt/hadoop/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: recon
      AUTH_PASSWORD: recon
    command: ["/opt/hadoop/bin/ozone","recon"]
    depends_on:
      keycloak:
        condition: service_healthy

  # ---- Apache Storm cluster + ZooKeeper ----

  zookeeper:
    image: zookeeper:3.9
    hostname: zookeeper
    dns_search: .
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 20

  nimbus:
    image: storm:${STORM_VERSION}
    hostname: nimbus
    dns_search: .
    user: "0:0"
    ports:
      - 6627:6627
    volumes:
      - ../..:/opt/ozone
      - ./ozone-site.xml:/opt/hadoop/etc/hadoop/ozone-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./storm.yaml:/conf/storm.yaml
      # Storm's daemon JVMs (nimbus / supervisor / ui) and worker
      # JVMs need Hadoop on the classpath so:
      #   1. the security-auth-agent can actually replace UGI
      #      (it Class.forName's org.apache.hadoop.security.
      #      UserGroupInformation at premain);
      #   2. topologies using HdfsBolt against ofs:// have the
      #      Ozone filesystem adapter available.
      # extlib-daemon jars go on nimbus/supervisor/ui classpaths;
      # extlib jars go on worker classpaths. Bind-mount the
      # whole ozone lib into both.
      - ../../share/ozone/lib:/apache-storm-2.6.4/extlib-daemon
      - ../../share/ozone/lib:/apache-storm-2.6.4/extlib
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/ozone/share/ozone/lib/*
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: storm
      AUTH_PASSWORD: storm
      # Storm's `storm nimbus` script uses STORM_JAR_JVM_OPTS for
      # the JAR/CLI JVM and *_CHILDOPTS for the daemon JVMs.
      # Setting JAVA_TOOL_OPTIONS is the sledgehammer — every JVM
      # spawned from this container (nimbus, storm CLI, worker
      # forks) inherits the agent. Cleaner than trying to fork
      # the load into three separate env vars.
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
        -Djava.security.krb5.realm=EXAMPLE.COM
        -Djava.security.krb5.kdc=kdc.example.com
    command: ["storm", "nimbus"]
    depends_on:
      zookeeper:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      om:
        condition: service_started

  supervisor:
    image: storm:${STORM_VERSION}
    hostname: supervisor
    dns_search: .
    user: "0:0"
    volumes:
      - ../..:/opt/ozone
      - ./ozone-site.xml:/opt/hadoop/etc/hadoop/ozone-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./storm.yaml:/conf/storm.yaml
      # Storm's daemon JVMs (nimbus / supervisor / ui) and worker
      # JVMs need Hadoop on the classpath so:
      #   1. the security-auth-agent can actually replace UGI
      #      (it Class.forName's org.apache.hadoop.security.
      #      UserGroupInformation at premain);
      #   2. topologies using HdfsBolt against ofs:// have the
      #      Ozone filesystem adapter available.
      # extlib-daemon jars go on nimbus/supervisor/ui classpaths;
      # extlib jars go on worker classpaths. Bind-mount the
      # whole ozone lib into both.
      - ../../share/ozone/lib:/apache-storm-2.6.4/extlib-daemon
      - ../../share/ozone/lib:/apache-storm-2.6.4/extlib
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/ozone/share/ozone/lib/*
      AUTH_SERVER_URL: http://keycloak:8080/realms/EXAMPLE.COM/protocol/openid-connect/token
      AUTH_CLIENT_ID: ozone-client
      AUTH_LOGIN: storm
      AUTH_PASSWORD: storm
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/ozone/share/ozone/lib/security-auth-agent-${HDDS_VERSION}.jar=auth-data-provider=env,auth-token-validation=none,auth-token-renewal=both
        -Djava.security.krb5.realm=EXAMPLE.COM
        -Djava.security.krb5.kdc=kdc.example.com
    command: ["storm", "supervisor"]
    depends_on:
      nimbus:
        condition: service_started

  storm-ui:
    image: storm:${STORM_VERSION}
    hostname: storm-ui
    dns_search: .
    ports:
      - 8083:8080
    volumes:
      - ./storm.yaml:/conf/storm.yaml
    command: ["storm", "ui"]
    depends_on:
      nimbus:
        condition: service_started
